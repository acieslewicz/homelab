argument_specs:
    main:
        short_description: "Installs and configures Komodo."
        options:
            version:
                type: str
                default: 2
                description: "Version of the docker image to use."
            backups_path:
                type: str
                default: /var/komodo/backups
                description: "Path to Komodo backups."
            timezone:
                type: str
                required: true
                description: "Komodo timezone configuration."

            #=-------------------------=#
            #= Komodo Core Environment =#
            #=-------------------------=#

            title:
                type: str
                default: Komodo
                description: "The document title shown on the web page."
            host:
                type: str
                required: true
                description: "The url used to access Komodo in the browser, potentially behind DNS. E.g. https://komodo.example.com"
            komodo_port:
                type: int
                default: 9120
                description: "The port the core system will run on."
            bind_ip:
                type: str
                default: "[::]"
                description: "The IP address the core server will bind to. Default allows external IPv4 and IPv6 connections."
            private_key:
                type: str
                default: "file:/config/keys/core.key"
                description: "Default private key to use with Noise handshake to authenticate with Periphery agents."
            periphery_public_key:
                type: str
                description: "Default accepted public key to allow Periphery to connect. Accepts public key files using file:/path/to/periphery.pub"
            first_server_name:
                type: str
                description: "Give the first server a custom name. If set but first_server_address is not, assumes Periphery -> Core connection."
            first_server_address:
                type: str
                description: "Ensure a server with this address exists on Core upon first startup. Example: https://periphery:8120"
            ui_write_disabled:
                type: bool
                default: false
                description: "Disables write support on resources in the UI."
            disable_confirm_dialog:
                type: bool
                default: false
                description: "Disables the confirm dialogs on all actions. All buttons will now be double-click."
            disable_websocket_reconnect:
                type: bool
                default: false
                description: "Disables UI websocket automatic reconnection."
            disable_init_resources:
                type: bool
                default: false
                description: "Disable init system resource creation on fresh Komodo launch (e.g. Backup Core Database and Global Auto Update procedures)."

            #=--------------=#
            #= AUTH / LOGIN =#
            #=--------------=#

            local_auth:
                type: bool
                default: false
                description: "Allow user login with a username / password."
            min_password_length:
                type: int
                default: 1
                description: "Configure a minimum password length."
            init_admin_username:
                type: str
                description: "Initialize the first admin user when starting up Komodo for the first time."
            init_admin_password:
                type: str
                default: "changeme"
                description: "Set password for the first admin user."
            disable_user_registration:
                type: bool
                default: false
                description: "When true, only the first user to log in will be registered as a user."
            enable_new_users:
                type: bool
                default: false
                description: "New users will be automatically enabled when they sign up."
            transparent_mode:
                type: bool
                default: false
                description: "Allows all users to have Read level access to all resources."
            disable_non_admin_create:
                type: bool
                default: false
                description: "When true, only admin users can create resources."
            jwt_secret:
                type: str
                default: ""
                description: "Optionally provide a specific jwt secret. Empty string generates a new secret on every startup."
            jwt_ttl:
                type: str
                default: "1-day"
                description: "Specify how long a user can stay logged in before they have to log in again."

            #=-----------=#
            #= OIDC Auth =#
            #=-----------=#

            oidc_enabled:
                type: bool
                default: false
                description: "Enable logins with configured OIDC provider."
            oidc_provider:
                type: str
                description: "The OIDC provider address, including path. Must be reachable from the Komodo Core container."
            oidc_redirect_host:
                type: str
                description: "OIDC user redirect host (browser-facing). If empty, oidc_provider host is used. Do not include the path."
            oidc_client_id:
                type: str
                description: "Set the OIDC Client ID."
            oidc_client_secret:
                type: str
                description: "Set the OIDC Client Secret. Not required if provider supports PKCE-only flow."
            oidc_use_full_email:
                type: bool
                description: "If true, use the full email for usernames. Otherwise the @address portion is stripped."
            oidc_additional_audiences:
                type: list
                elements: str
                description: "Additional trusted audiences beyond the client_id. Use if you see 'Invalid audiences' errors."

            #=-------=#
            #= OAUTH =#
            #=-------=#

            google_oauth_enabled:
                type: bool
                default: false
                description: "Enable Google OAuth."
            google_oauth_id:
                type: str
                description: "Google OAuth client ID. Required if google_oauth_enabled is true."
            google_oauth_secret:
                type: str
                description: "Google OAuth client secret. Required if google_oauth_enabled is true."
            github_oauth_enabled:
                type: bool
                default: false
                description: "Enable GitHub OAuth."
            github_oauth_id:
                type: str
                description: "GitHub OAuth client ID. Required if github_oauth_enabled is true."
            github_oauth_secret:
                type: str
                description: "GitHub OAuth client secret. Required if github_oauth_enabled is true."

            #=---------------------=#
            #= Auth Rate Limiting  =#
            #=---------------------=#

            auth_rate_limit_disabled:
                type: bool
                default: false
                description: "Disable the global auth failure rate limiter by client IP address."
            auth_rate_limit_max_attempts:
                type: int
                default: 5
                description: "Max failed auth attempts allowed within the rate limit window before the client is blocked."
            auth_rate_limit_window_seconds:
                type: int
                default: 15
                description: "The rate limiting window in seconds."

            #=------------------=#
            #= Poll Intervals   =#
            #=------------------=#

            monitoring_interval:
                type: str
                default: "15-sec"
                description: "Controls the rate at which servers are polled for health, system stats, and container status."
            resource_poll_interval:
                type: str
                default: "1-hr"
                description: "Interval at which to poll Resources for any updates / automated actions."

            #=----------=#
            #= DATABASE =#
            #=----------=#

            db_username:
                type: str
                default: admin
                description: "Username for the database."
            db_password:
                type: str
                required: true
                description: "Password for the database."

            #=-----------=#
            #= Webhooks  =#
            #=-----------=#

            webhook_secret:
                type: str
                default: ""
                description: "Token given to the git provider during repo webhook config. Must match the secret configured on the provider side."
            webhook_base_url:
                type: str
                default: ""
                description: "Alternate base URL for receiving git webhook requests. Useful when Komodo is on an internal network behind a proxy."

            #=---------=#
            #= Logging =#
            #=---------=#

            logging_pretty:
                type: bool
                default: false
                description: "Specify whether logging is more human readable. Note: single logs will span multiple lines."
            pretty_startup_config:
                type: bool
                default: false
                description: "Specify whether startup config log is more human readable (multi-line)."

            #=-----------------=#
            #= Cloud Providers =#
            #=-----------------=#

            aws_access_key_id:
                type: str
                default: ""
                description: "AWS access key ID for ephemeral EC2 builders."
            aws_secret_access_key:
                type: str
                default: ""
                description: "AWS secret access key for ephemeral EC2 builders."

            #=-----------------=#
            #= Git Providers   =#
            #=-----------------=#

            git_providers:
                type: list
                elements: dict
                default: []
                description: "Git provider configurations for accessing private repositories."
                options:
                    domain:
                        type: str
                        required: true
                        description: "Git provider domain (e.g., github.com, gitlab.com)."
                    https:
                        type: bool
                        default: true
                        description: "Whether to use HTTPS (true) or HTTP (false)."
                    accounts:
                        type: list
                        elements: dict
                        required: true
                        description: "List of accounts with access tokens."
                        options:
                            username:
                                type: str
                                required: true
                                description: "Username for the git provider account."
                            token:
                                type: str
                                required: true
                                description: "Access token for authentication."

            #=---------=#
            #= Secrets =#
            #=---------=#

            komodo_secrets:
                type: dict
                default: {}
                description: "Application-level secrets available for interpolation into deployments and stacks. Keys are secret names, values are secret values."